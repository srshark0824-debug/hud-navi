<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>HUDナビ（3）</title>

<style>
body {
  background: black;
  color: rgb(0, 255, 13);
  font-family: monospace;
  text-align: center;
  margin-top: 7vh;
}

.hud-large { font-size: 1.2em; }

#arrow {
  width: 150px;
  height: 150px;
  margin: 0 auto 20px;
  background: url('arrow.png') no-repeat center;
  background-size: contain;
  transform-origin: 50% 60%;
  transition: transform 0.3s linear;
}

#arrivalView {
  display:none;
}

#arrivalImage {
  width:100%;
  max-height:70vh;
  object-fit:contain;
}
</style>
</head>

<body>
<h2>HUDナビ</h2>
<div id="arrow"></div>
<p id="info">目的地を設定してください。</p>

<div class="controls">
  <button id="startBtn">▶️ ナビ開始</button>
  <button id="fontToggleBtn">🔍 大文字モード</button>
  <div style="margin-top:20px;">
    <button id="listBtn">📋 目的地一覧</button>
    <button id="resetBtn">♻ リセット</button>
  </div>
</div>

<div id="arrivalView">
  <img id="arrivalImage">
  <p id="arrivalText"></p>
</div>

<div id="listView" style="display:none;"></div>

<script>
const API_KEY = "AIzaSyDHRitaxXlwj13-dz9zPKpwvhGZorwzgRY";

// ================================
// グローバル状態
// ================================
let waypoints = [];
let currentIndex = 0;
let arrived = false;
let isArrivalShowing = false;
let headingOffset = 0;
let headingHistory = [];

// ================================
// 方位センサー
// ================================
async function enableOrientation() {
  try {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e) {
    console.warn("方位センサー未許可");
  }

  window.addEventListener("deviceorientation", e => {
    let h = e.webkitCompassHeading ?? (e.alpha ? 360 - e.alpha : null);
    if (h !== null) {
      headingHistory.push(h);
      if (headingHistory.length > 5) headingHistory.shift();
      headingOffset = headingHistory.reduce((a,b)=>a+b,0)/headingHistory.length;
    }
  });
}

// ================================
// 保存 / 読込
// ================================
function saveWaypoints() {
  localStorage.setItem("hud_waypoints", JSON.stringify(waypoints));
}
function loadWaypoints() {
  const s = localStorage.getItem("hud_waypoints");
  if (!s) return false;
  waypoints = JSON.parse(s);
  return waypoints.length > 0;
}

// ================================
// 到着演出
// ================================
function showArrival(target) {
  document.getElementById("arrow").style.display = "none";
  document.getElementById("arrivalView").style.display = "block";
  document.getElementById("arrivalText").innerText = `📍 到着：${target.name}`;

  const img = document.getElementById("arrivalImage");
  if (target.image) {
    img.src = target.image;
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }
}

function hideArrivalAndNext() {
  document.getElementById("arrivalView").style.display = "none";
  document.getElementById("arrow").style.display = "block";

  currentIndex++;
  arrived = false;
  isArrivalShowing = false;

  if (currentIndex >= waypoints.length) {
    document.getElementById("info").innerText = "🎉 全目的地に到着しました！";
    document.getElementById("arrow").style.display = "none";
  }
}

// ================================
// 計算
// ================================
function getDistance(a,b,c,d){
  const R=6371e3;
  const x=(c-a)*Math.PI/180;
  const y=(d-b)*Math.PI/180;
  return Math.sqrt(x*x+y*y)*R;
}
function getBearing(a,b,c,d){
  return (Math.atan2(d-b,c-a)*180/Math.PI+360)%360;
}

// ================================
// ナビ開始
// ================================
function startNavigation() {
  navigator.geolocation.watchPosition(pos => {
    if (arrived) return;

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const acc = pos.coords.accuracy;

    const t = waypoints[currentIndex];
    const dist = getDistance(lat,lon,t.lat,t.lon);
    const bear = getBearing(lat,lon,t.lat,t.lon);
    const rot = (bear - headingOffset + 360) % 360;

    if (dist < 40 && acc < 30 && !arrived) {
      arrived = true;
      isArrivalShowing = true;
      showArrival(t);
      setTimeout(hideArrivalAndNext, 5000);
      return;
    }

    if (!isArrivalShowing) {
      document.getElementById("arrow").style.transform = `rotate(${rot}deg)`;
      document.getElementById("info").innerText =
        `目的地：${t.name}\n距離：約${dist.toFixed(1)}m`;
    }
  }, err => {
    document.getElementById("info").innerText = "位置情報が取得できません";
  }, { enableHighAccuracy:true });
}

// ================================
// UI
// ================================
document.getElementById("startBtn").onclick = async () => {
  await enableOrientation();
  if (!loadWaypoints()) {
    alert("目的地を設定してください");
    return;
  }
  document.getElementById("startBtn").style.display = "none";
  startNavigation();
};

document.getElementById("resetBtn").onclick = () => {
  localStorage.clear();
  location.reload();
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>
</body>
</html>
